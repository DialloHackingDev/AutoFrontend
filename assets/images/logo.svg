<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Circle background -->
  <circle cx="100" cy="100" r="95" fill="#1E3A8A" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Car icon -->
  <g fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Car body -->
    <path d="M 50 120 L 60 70 L 140 70 L 150 120 Z"/>
    <!-- Roof -->
    <path d="M 70 70 L 80 50 L 120 50 L 130 70"/>
    <!-- Windows -->
    <rect x="70" y="55" width="25" height="12" fill="none"/>
    <rect x="105" y="55" width="25" height="12" fill="none"/>
  </g>
  
  <!-- Wheels -->
  <circle cx="70" cy="120" r="8" fill="white"/>
  <circle cx="130" cy="120" r="8" fill="white"/>
</svg>