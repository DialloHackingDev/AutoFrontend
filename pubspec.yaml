name: frontend
description: "AutoConnect - Plateforme de mobilité intelligente"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.1
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  geolocator: ^13.0.1
  google_maps_flutter: ^2.10.0
  mobile_scanner: ^6.0.4
  qr_flutter: ^4.1.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  logger: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
