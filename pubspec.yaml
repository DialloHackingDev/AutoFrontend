name: frontend
description: "AutoConnect - Plateforme de mobilité intelligente"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.1
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  geolocator: ^13.0.1
  google_maps_flutter: ^2.10.0
  mobile_scanner: ^6.0.4
  qr_flutter: ^4.1.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  logger: ^2.4.0
  maplibre_gl: ^0.27.1
  socket_io_client: ^3.1.6
  flutter_local_notifications: ^22.3.3
  url_launcher: ^6.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  # Icône générée depuis le logo officiel (logo.png à la racine du projet)
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  remove_alpha_ios: true
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/

  # Police intégrée à l'app : aucun téléchargement au démarrage (fonctionnement hors ligne)
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/Poppins-Regular.ttf
        - asset: assets/fonts/poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/poppins/Poppins-Bold.ttf
          weight: 700
